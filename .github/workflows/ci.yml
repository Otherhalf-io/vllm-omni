name: Color contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  color-contracts:
    name: Color TTS contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The release-provenance contract verifies ancestry from the pinned
          # upstream base, so the contract job needs the complete commit graph.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Compile Color-owned serving surfaces
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python -m py_compile \
            vllm_omni/entrypoints/openai/protocol/audio.py \
            vllm_omni/entrypoints/openai/serving_speech.py \
            vllm_omni/entrypoints/openai/serving_speech_stream.py \
            vllm_omni/model_executor/models/qwen3_tts/prompt_embeds_builder.py \
            vllm_omni/model_executor/models/qwen3_tts/qwen3_tts_talker.py \
            vllm_omni/utils/speaker_cache.py

      - name: Run dependency-light contract tests
        run: |
          set -euo pipefail
          tests=(tests/color_contracts/test_fork_contract.py)
          for candidate in \
            tests/color_contracts/test_request_contract.py \
            tests/color_contracts/test_maya_profile_contract.py \
            tests/color_contracts/test_docker_build_contract.py; do
            if [[ -f "${candidate}" ]]; then
              tests+=("${candidate}")
            fi
          done
          PYTHONPATH=. uv run \
            --no-project \
            --python 3.12 \
            --with pytest \
            --with pydantic \
            --with numpy \
            --with torch \
            --with safetensors \
            pytest -q -c /dev/null -p no:cacheprovider \
              --confcutdir=tests/color_contracts --maxfail=1 "${tests[@]}"

      - name: Run CustomVoice admission contract
        if: ${{ hashFiles('tests/entrypoints/openai_api/test_custom_voice_default_contract.py') != '' }}
        run: |
          set -euo pipefail
          uv run \
            --no-project \
            --python 3.12 \
            --with pytest \
            pytest -q -c /dev/null -p no:cacheprovider \
              --confcutdir=tests/entrypoints/openai_api --maxfail=1 \
              tests/entrypoints/openai_api/test_custom_voice_default_contract.py

      - name: Run CustomVoice point-of-use regression
        if: ${{ hashFiles('tests/entrypoints/openai_api/test_custom_voice_point_of_use.py') != '' }}
        env:
          PYTHONPATH: .
          UV_TORCH_BACKEND: cpu
        run: |
          set -euo pipefail
          uv run \
            --no-project \
            --python 3.12 \
            --with-requirements .github/requirements/color-serving-tests.txt \
            pytest -q -c /dev/null -p no:cacheprovider \
              --confcutdir=tests/entrypoints/openai_api --maxfail=1 \
              tests/entrypoints/openai_api/test_custom_voice_point_of_use.py

  request-input-isolation:
    name: TTS request input isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5

      - name: Run integrated request-isolation regressions
        env:
          PYTHONPATH: .
          UV_TORCH_BACKEND: cpu
        run: |
          set -euo pipefail
          uv run \
            --no-project \
            --python 3.12 \
            --with-requirements .github/requirements/color-serving-tests.txt \
            pytest -q -c /dev/null -p no:cacheprovider \
              --confcutdir=tests --maxfail=1 \
              tests/worker/test_gpu_ar_model_runner.py::test_request_input_error_is_isolated_and_next_request_continues \
              tests/worker/test_gpu_ar_model_runner.py::test_untyped_preprocessing_errors_remain_fatal \
              tests/worker/test_gpu_ar_model_runner.py::test_qwen_prompt_builder_classifies_malformed_ref_audio \
              tests/core/sched/test_omni_ar_scheduler_logprobs.py::test_preprocessing_error_frees_request_and_removes_it_from_running \
              tests/engine/test_output_processor.py::test_preprocessing_error_becomes_typed_terminal_request_output
