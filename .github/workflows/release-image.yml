name: Release Image

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: "preview"
        options:
          - preview
          - stable
      ref:
        description: "Git ref to build. Stable releases must use main."
        required: true
        type: string
        default: "main"
      base_image:
        description: "Base vLLM image used by docker/Dockerfile.cuda"
        required: true
        type: string
        default: "vllm/vllm-openai:v0.20.0"

concurrency:
  group: release-image-${{ inputs.channel }}
  cancel-in-progress: false

env:
  REGISTRY: us-west1-docker.pkg.dev/withcolor-dev/color
  IMAGE_NAME: vllm-omni

jobs:
  build:
    name: Build ${{ inputs.channel }} image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Guard stable releases
        run: |
          if [[ "${{ inputs.channel }}" == "stable" && "${{ inputs.ref }}" != "main" && "${{ inputs.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Stable vllm-omni releases must build main."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve image tags
        id: tags
        run: |
          short_sha="$(git rev-parse --short=8 HEAD)"
          immutable_tag="${{ inputs.channel }}-${short_sha}"
          upstream_eval_tag="upstream-${short_sha}-qwen3-system1"
          latest_tag="latest-${{ inputs.channel }}"
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          {
            echo "short_sha=${short_sha}"
            echo "immutable_tag=${immutable_tag}"
            echo "upstream_eval_tag=${upstream_eval_tag}"
            echo "latest_tag=${latest_tag}"
            echo "immutable_image=${image}:${immutable_tag}"
            echo "upstream_eval_image=${image}:${upstream_eval_tag}"
            echo "latest_image=${image}:${latest_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/Dockerfile.cuda
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.immutable_image }}
            ${{ steps.tags.outputs.upstream_eval_image }}
            ${{ steps.tags.outputs.latest_image }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}

      - name: Summary
        run: |
          {
            echo "## vllm-omni image release"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| channel | \`${{ inputs.channel }}\` |"
            echo "| ref | \`${{ inputs.ref }}\` |"
            echo "| short SHA | \`${{ steps.tags.outputs.short_sha }}\` |"
            echo "| base image | \`${{ inputs.base_image }}\` |"
            echo "| immutable image | \`${{ steps.tags.outputs.immutable_image }}\` |"
            echo "| upstream eval image | \`${{ steps.tags.outputs.upstream_eval_image }}\` |"
            echo "| latest alias | \`${{ steps.tags.outputs.latest_image }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
